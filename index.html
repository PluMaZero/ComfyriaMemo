<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfyria_Memo - 캐릭터 시트 & 3D 뷰어</title>
    <!-- Three.js 라이브러리 로드 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #1e1e1e; padding: 20px; display: flex; flex-direction: column; align-items: center; color: #333; margin: 0; }
        h1 { color: #ffffff; }
        
        /* 3단 구성을 위해 max-width 조정 */
        .container { display: flex; gap: 20px; max-width: 1400px; width: 100%; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
        
        .box { background-color: #ffffff; padding: 25px; border-radius: 15px; flex: 1; min-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); box-sizing: border-box; }
        h3 { color: #333; margin-top: 0; }
        
        input, textarea { width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background-color: #f9f9f9; color: #333; font-family: inherit; }
        #preview { width: 100%; max-height: 200px; object-fit: contain; margin-bottom: 15px; border: 1px solid #ddd; display: none; }
        
        button { padding: 12px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
        button:hover { background-color: #6366f1; }
        .copy-btn { background-color: #10b981; }
        .copy-btn:hover { background-color: #059669; }
        textarea { height: 80px; resize: vertical; }

        /* 3D 뷰어 스타일 */
        #canvas-container { 
            width: 100%; 
            height: 400px; 
            background: radial-gradient(circle, #444, #111); 
            border-radius: 10px; 
            overflow: hidden;
            position: relative;
        }
        #loading-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 0.9em; pointer-events: none; }
    </style>
</head>
<body>

    <h1>캐릭터 시트 & 3D 뷰어</h1>

    <div class="container">
        <!-- 1. 입력부 -->
        <div class="box">
            <h3>이미지 업로드 및 입력</h3>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
            <img id="preview" src="#" alt="미리보기">
            <input type="text" id="charName" placeholder="캐릭터 특징 (예: 갈색머리 모험가)">
            <textarea id="outfit" placeholder="주요 의상 (예: 오렌지 셔츠, 베이지 바지)"></textarea>
            <textarea id="items" placeholder="아이템 상세 (예: 가죽 배낭, 나침반)"></textarea>
            <button onclick="generatePrompts()">프롬프트 생성하기</button>
        </div>

        <!-- 2. 결과부 -->
        <div class="box">
            <h3>프롬프트 결과</h3>
            <p>3면도 프롬프트:</p>
            <textarea id="refSheet"></textarea>
            <button class="copy-btn" onclick="copyText('refSheet')">복사하기</button>

            <p>아이템 디자인 시트:</p>
            <textarea id="itemSheet"></textarea>
            <button class="copy-btn" onclick="copyText('itemSheet')">복사하기</button>
        </div>

        <!-- 3. 3D 뷰어부 -->
        <div class="box">
            <h3>Character 3D View</h3>
            <div id="canvas-container">
                <div id="loading-msg">3D 모델을 불러오는 중...</div>
            </div>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">* 마우스 드래그로 회전, 휠로 확대/축소 가능</p>
        </div>
    </div>

    <script>
        // 기존 함수들
        function previewImage(event) {
            const preview = document.getElementById('preview');
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = () => { preview.src = reader.result; preview.style.display = 'block'; }
            if (file) reader.readAsDataURL(file);
        }

        function generatePrompts() {
            const name = document.getElementById('charName').value;
            const outfit = document.getElementById('outfit').value;
            const items = document.getElementById('items').value;
            document.getElementById('refSheet').value = `Character sheet of ${name}, wearing ${outfit}, front view, side view, back view, standing on white background, high quality, anime style, flat color, masterpiece.`;
            document.getElementById('itemSheet').value = `Design sheet of isolated items for ${name}, including ${outfit} and ${items}. Items arranged neatly on a plain white background, professional reference sheet style.`;
        }

        function copyText(id) {
            const textarea = document.getElementById(id);
            textarea.select();
            document.execCommand('copy');
            alert('복사되었습니다!');
        }
    </script>

    <!-- Three.js 로직 -->
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        const loadingMsg = document.getElementById('loading-msg');

        // 1. Scene 설정
        const scene = new THREE.Scene();
        
        // 2. Camera 설정
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        // 3. Renderer 설정
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 4. 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // 5. 마우스 컨트롤
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0);

        // 6. GLTF 모델 로드
        const loader = new GLTFLoader();
        
        // 중요: 여기에 업로드하신 .glb 파일 경로를 입력하세요!
        // 예: 'model.glb' 또는 'assets/character.glb'
        const modelPath = 'Wizard.glb'; 

        loader.load(
            modelPath, 
            function (gltf) {
                const model = gltf.scene;
                scene.add(model);
                loadingMsg.style.display = 'none'; // 로딩 메시지 숨김
                
                // 모델 중앙 정렬 및 크기 자동 조정 (필요 시)
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center); 
                model.position.y += (box.max.y - box.min.y) / 2; // 발바닥을 바닥에 맞춤
            },
            undefined,
            function (error) {
                console.error(error);
                loadingMsg.innerText = '모델 로드 실패 (파일명을 확인하세요)';
            }
        );

        // 7. 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 8. 창 크기 조절 대응
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
