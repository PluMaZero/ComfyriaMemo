<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>캐릭터 시트 작성기</title>
    <style>
        .sheet { border: 1px solid #ccc; padding: 20px; width: 300px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>캐릭터 시트 생성</h1>
    <input type="text" id="name" placeholder="이름 입력">
    <input type="text" id="job" placeholder="직업 입력">
    <button onclick="createSheet()">생성하기</button>

    <div id="result" class="sheet" style="display:none;">
        <h3>캐릭터 정보</h3>
        <p>이름: <span id="out-name"></span></p>
        <p>직업: <span id="out-job"></span></p>
    </div>

    <script>
        function createSheet() {
            document.getElementById('out-name').innerText = document.getElementById('name').value;
            document.getElementById('out-job').innerText = document.getElementById('job').value;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
