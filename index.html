<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfyria_Memo - 캐릭터 시트 & 3D 뷰어 & 아카이브</title>
    
    <!-- 1. model-viewer 라이브러리 로드 (3D 뷰어용) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        /* 기본 레이아웃 설정 */
        body { font-family: 'Pretendard', sans-serif; background-color: #1e1e1e; padding: 20px; display: flex; flex-direction: column; align-items: center; color: #333; margin: 0; }
        h1 { color: #ffffff; margin-bottom: 20px; }
        h3 { color: #333; margin-top: 0; margin-bottom: 15px; }

        /* 가로 배치용 컨테이너 (3단 구성) */
        .container { display: flex; gap: 20px; max-width: 1500px; width: 100%; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
        
        /* 기본 박스 스타일 */
        .box { background-color: #ffffff; padding: 25px; border-radius: 15px; flex: 1; min-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); box-sizing: border-box; }
        
        /* 입력 요소 스타일 */
        input, textarea { width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background-color: #f9f9f9; color: #333; font-family: inherit; }
        #preview { width: 100%; max-height: 250px; object-fit: contain; margin-bottom: 15px; border: 1px solid #ddd; display: none; }
        
        /* 버튼 스타일 */
        button { padding: 12px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        button:hover { background-color: #6366f1; }
        .copy-btn { background-color: #10b981; }
        .copy-btn:hover { background-color: #059669; }
        textarea { height: 80px; resize: vertical; }

        /* --- 3D 뷰어 구역 --- */
        .viewer-box { position: relative; width: 100%; height: 400px; background-color: #282828; border-radius: 10px; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; }
        
        .side-panel { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 100; pointer-events: none; }
        .ctrl-btn { pointer-events: auto; background: rgba(0,0,0,0.7); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; backdrop-filter: blur(4px); cursor: pointer; padding: 4px 8px; font-size: 10px; width: fit-content; }
        .ctrl-btn.active { color: #4ade80; border-color: #4ade80; }
        .ctrl-slider { pointer-events: auto; background: rgba(0,0,0,0.7); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 6px 8px; font-size: 9px; width: 100px; display: flex; flex-direction: column; gap: 4px; }
        .ctrl-stats { pointer-events: none; background: rgba(0,0,0,0.7); color: #aaa; border-radius: 4px; padding: 6px 8px; font-size: 9px; font-family: monospace; }

        /* --- 게시판 구역 --- */
        .archive-section { width: 100%; max-width: 1460px; margin-top: 40px; }
        .post-form { display: flex; gap: 20px; background: #fff; padding: 25px; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; width: 100%; }
        .post-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; display: flex; flex-direction: column; }
        .post-card img { width: 100%; height: 200px; object-fit: cover; }
        .post-card-body { padding: 15px; flex: 1; }
        .post-card h4 { margin: 0 0 10px 0; font-size: 18px; color: #333; }
        .post-card p { margin: 0; font-size: 14px; color: #666; line-height: 1.5; white-space: pre-wrap; }
        .post-card .date { font-size: 11px; color: #bbb; margin-top: 10px; }
        .delete-post-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.7); color: white; border: none; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <h1>캐릭터 시트 & 3D 아카이브</h1>

    <div class="container">
        <!-- 1. 입력부 -->
        <div class="box">
            <h3>정보 입력</h3>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
            <img id="preview" src="#" alt="미리보기">
            <input type="text" id="charName" placeholder="캐릭터 특징 (예: 은발의 마법사)">
            <textarea id="outfit" placeholder="주요 의상 (예: 푸른색 로브, 금색 장식)"></textarea>
            <textarea id="items" placeholder="아이템 상세 (예: 마법 지팡이, 가죽 고서)"></textarea>
            <button onclick="generatePrompts()">프롬프트 생성하기</button>
        </div>

        <!-- 2. 결과부 -->
        <div class="box">
            <h3>프롬프트 결과</h3>
            <p style="font-size: 13px; font-weight: bold; margin-bottom: 5px;">3면도 프롬프트:</p>
            <textarea id="refSheet"></textarea>
            <button class="copy-btn" onclick="copyText('refSheet')">복사하기</button>

            <p style="font-size: 13px; font-weight: bold; margin-bottom: 5px; margin-top: 10px;">아이템 시트 프롬프트:</p>
            <textarea id="itemSheet"></textarea>
            <button class="copy-btn" onclick="copyText('itemSheet')">복사하기</button>
        </div>

        <!-- 3. 3D 뷰어부 -->
        <div class="box">
            <h3>Character 3D Preview</h3>
            <div class="viewer-box">
                <div class="side-panel">
                    <button id="wireframeBtn" class="ctrl-btn">Wireframe: OFF</button>
                    <button id="rotateBtn" class="ctrl-btn">Auto Rotate: OFF</button>
                    <div class="ctrl-slider">
                        <span id="expLabel">Brightness: 1.0</span>
                        <input type="range" id="expSlider" min="0" max="3" step="0.1" value="1.0" style="width: 100%;">
                    </div>
                    <div id="statsBox" class="ctrl-stats">Vertices: -<br>Faces: -</div>
                </div>
                <!-- 여기에 본인의 .glb 파일 이름을 넣으세요 -->
                <model-viewer id="mainViewer" src="Wizard.glb" camera-controls shadow-intensity="1" environment-image="neutral">
                </model-viewer>
            </div>
            <p style="font-size: 11px; color: #888; margin-top: 8px; text-align: center;">드래그: 회전 / 휠: 확대</p>
        </div>
    </div>

    <!-- 4. 게시판(아카이브) 구역 -->
    <div class="archive-section">
        <h2 style="color: white; text-align: center; margin-bottom: 30px;">Character Archive</h2>
        
        <!-- 글쓰기 폼 -->
        <div class="post-form">
            <div style="flex: 0 0 200px;">
                <p style="font-size: 12px; margin-bottom: 5px; color: #666;">캐릭터 대표 이미지</p>
                <input type="file" id="archiveImage" accept="image/*" style="font-size: 11px;">
            </div>
            <div style="flex: 1;">
                <input type="text" id="archiveTitle" placeholder="캐릭터 이름 또는 제목" style="margin-bottom: 10px;">
                <textarea id="archiveContent" placeholder="캐릭터의 설정이나 특징을 기록하세요." style="height: 100px; margin-bottom: 0;"></textarea>
            </div>
            <div style="flex: 0 0 150px; display: flex; align-items: flex-end;">
                <button onclick="savePost()" style="height: 100px; background-color: #10b981; margin-bottom: 0;">아카이브 등록</button>
            </div>
        </div>

        <!-- 리스트 출력 -->
        <div id="postGrid" class="post-grid"></div>
    </div>

    <script>
        /* [1. 기본 프롬프트 기능] */
        function previewImage(event) {
            const preview = document.getElementById('preview');
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = () => { preview.src = reader.result; preview.style.display = 'block'; }
            if (file) reader.readAsDataURL(file);
        }

        function generatePrompts() {
            const name = document.getElementById('charName').value;
            const outfit = document.getElementById('outfit').value;
            const items = document.getElementById('items').value;
            document.getElementById('refSheet').value = `Character sheet of ${name}, wearing ${outfit}, front view, side view, back view, standing on white background, anime style, flat color, masterpiece.`;
            document.getElementById('itemSheet').value = `Design sheet of isolated items for ${name}, including ${outfit} and ${items}. Professional reference sheet, white background.`;
        }

        function copyText(id) {
            const textarea = document.getElementById(id);
            textarea.select();
            document.execCommand('copy');
            alert('복사되었습니다!');
        }

        /* [2. 3D 뷰어 조작 로직] */
        const mv = document.querySelector('#mainViewer');
        const wireframeBtn = document.querySelector('#wireframeBtn');
        const rotateBtn = document.querySelector('#rotateBtn');
        const expSlider = document.querySelector('#expSlider');
        const expLabel = document.querySelector('#expLabel');
        const statsBox = document.querySelector('#statsBox');

        let wireframeActive = false;

        wireframeBtn.onclick = () => {
            wireframeActive = !wireframeActive;
            const sceneSymbol = Object.getOwnPropertySymbols(mv).find(s => s.description === 'scene');
            const scene = mv[sceneSymbol];
            if (scene) {
                scene.traverse((obj) => {
                    if (obj.isMesh && obj.material) {
                        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                        mats.forEach(m => { m.wireframe = wireframeActive; });
                    }
                });
            }
            wireframeBtn.innerText = `Wireframe: ${wireframeActive ? 'ON' : 'OFF'}`;
            wireframeBtn.classList.toggle('active', wireframeActive);
        };

        rotateBtn.onclick = () => {
            const active = mv.hasAttribute('auto-rotate');
            if (active) mv.removeAttribute('auto-rotate');
            else mv.setAttribute('auto-rotate', '');
            rotateBtn.innerText = `Auto Rotate: ${!active ? 'ON' : 'OFF'}`;
            rotateBtn.classList.toggle('active', !active);
        };

        expSlider.oninput = (e) => {
            mv.setAttribute('exposure', e.target.value);
            expLabel.innerText = `Brightness: ${Number(e.target.value).toFixed(1)}`;
        };

        mv.addEventListener('load', () => {
            let v = 0, f = 0;
            const sceneSymbol = Object.getOwnPropertySymbols(mv).find(s => s.description === 'scene');
            const scene = mv[sceneSymbol];
            if (scene) {
                scene.traverse((obj) => {
                    if (obj.isMesh && obj.geometry) {
                        v += obj.geometry.attributes.position.count;
                        f += obj.geometry.index ? obj.geometry.index.count / 3 : obj.geometry.attributes.position.count / 3;
                    }
                });
                statsBox.innerHTML = `Vertices: ${new Intl.NumberFormat().format(v)}<br>Faces: ${new Intl.NumberFormat().format(Math.floor(f))}`;
            }
        });

        /* [3. 게시판(아카이브) 로직] */
        window.addEventListener('DOMContentLoaded', displayPosts);

        function savePost() {
            const title = document.getElementById('archiveTitle').value;
            const content = document.getElementById('archiveContent').value;
            const imgInput = document.getElementById('archiveImage');
            
            if (!title || !content) { alert("제목과 내용을 입력해주세요."); return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                const posts = JSON.parse(localStorage.getItem('memo_posts') || '[]');
                const newPost = {
                    id: Date.now(),
                    title: title,
                    content: content,
                    image: e.target.result,
                    date: new Date().toLocaleDateString()
                };
                posts.unshift(newPost);
                localStorage.setItem('memo_posts', JSON.stringify(posts));
                
                // 입력창 초기화
                document.getElementById('archiveTitle').value = '';
                document.getElementById('archiveContent').value = '';
                imgInput.value = '';
                displayPosts();
            };

            if (imgInput.files[0]) {
                reader.readAsDataURL(imgInput.files[0]);
            } else {
                // 이미지가 없을 때 기본 이미지
                reader.onload({ target: { result: 'https://via.placeholder.com/400x300?text=No+Image' } });
            }
        }

        function displayPosts() {
            const grid = document.getElementById('postGrid');
            const posts = JSON.parse(localStorage.getItem('memo_posts') || '[]');
            grid.innerHTML = '';

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <button class="delete-post-btn" onclick="deletePost(${post.id})">×</button>
                    <img src="${post.image}">
                    <div class="post-card-body">
                        <h4>${post.title}</h4>
                        <p>${post.content}</p>
                        <div class="date">${post.date}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function deletePost(id) {
            if (confirm("삭제하시겠습니까?")) {
                let posts = JSON.parse(localStorage.getItem('memo_posts') || '[]');
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem('memo_posts', JSON.stringify(posts));
                displayPosts();
            }
        }
    </script>
</body>
</html>
