<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfyria_Memo - 캐릭터 시트 생성기</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; gap: 20px; max-width: 1000px; width: 100%; flex-wrap: wrap; }
        .box { background: white; padding: 25px; border-radius: 15px; flex: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #333; }
        input { width: 95%; margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        #preview { width: 100%; max-height: 300px; object-fit: contain; margin-bottom: 15px; border: 1px solid #eee; display: none; }
        textarea { width: 100%; height: 100px; margin-top: 5px; font-size: 13px; padding: 10px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #4338ca; }
        .copy-btn { background-color: #10b981; margin-top: 5px; }
        .copy-btn:hover { background-color: #059669; }

        textarea { 
            width: 100%; 
            min-height: 80px; /* 높이 확보 */
            margin-bottom: 15px; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            resize: vertical; /* 사용자가 높이를 조절할 수 있게 함 */
            box-sizing: border-box; /* 패딩이 너비에 포함되게 함 */
            font-family: inherit;
        }
    </style>
</head>
<body>

    <h1>캐릭터 시트 & 프롬프트 생성기</h1>

    <div class="container">
        <!-- 왼쪽: 입력부 -->
        <div class="box">
            <h3>이미지 업로드 및 정보 입력</h3>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
            <img id="preview" src="#" alt="미리보기">
            
            <input type="text" id="charName" placeholder="캐릭터 특징 (예: 갈색머리 모험가)">
            
            <!-- 멀티라인 입력 가능한 textarea로 변경 -->
            <textarea id="outfit" placeholder="주요 의상 (예: 오렌지 셔츠, 베이지 바지)"></textarea>
            <textarea id="items" placeholder="아이템 상세 (예: 가죽 배낭, 나침반, 목걸이, 등산화)"></textarea>
            
            <button onclick="generatePrompts()">프롬프트 생성하기</button>
        </div>

        <!-- 오른쪽: 결과부 -->
        <div class="box">
            <h3>프롬프트 결과</h3>
            <p>3면도 프롬프트:</p>
            <textarea id="refSheet"></textarea>
            <button class="copy-btn" onclick="copyText('refSheet')">복사하기</button>

            <p>아이템 디자인 시트 프롬프트:</p>
            <textarea id="itemSheet"></textarea>
            <button class="copy-btn" onclick="copyText('itemSheet')">복사하기</button>
        </div>
    </div>

    <script>
        function previewImage(event) {
            const preview = document.getElementById('preview');
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = () => {
                preview.src = reader.result;
                preview.style.display = 'block';
            }
            if (file) reader.readAsDataURL(file);
        }

        function generatePrompts() {
            const name = document.getElementById('charName').value;
            const outfit = document.getElementById('outfit').value;
            const items = document.getElementById('items').value;

            document.getElementById('refSheet').value = 
                `Character sheet of ${name}, wearing ${outfit}, front view, side view, back view, standing on white background, high quality, anime style, flat color, masterpiece.`;
            
            document.getElementById('itemSheet').value = 
                `Design sheet of isolated items and accessories for ${name}, including ${outfit} and ${items}. Items arranged neatly on a plain white background, professional reference sheet style, high resolution, detailed texture, no character, no human, flat 2D layout, clear edges, product photography.`;
        }

        function copyText(id) {
            const textarea = document.getElementById(id);
            textarea.select();
            document.execCommand('copy');
            alert('프롬프트가 복사되었습니다!');
        }
    </script>
</body>
</html>
