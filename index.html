<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfyria_Memo - 캐릭터 시트</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f3; display: flex; flex-direction: column; align-items: center; padding: 40px; margin: 0; }
        
        .input-section { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px; display: flex; gap: 10px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; width: 120px; }
        button { padding: 10px 20px; background-color: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #4f46e5; }

        .sheet { 
            background: white; padding: 40px; width: 350px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-top: 10px solid #6366f1;
            display: none; transition: 0.3s;
        }
        .sheet h2 { margin: 0 0 15px 0; color: #333; font-size: 24px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .sheet p { margin: 10px 0; font-size: 18px; color: #555; }
        .sheet span { font-weight: bold; color: #000; }
    </style>
</head>
<body>

    <h1>캐릭터 시트 생성기</h1>

    <div class="input-section">
        <input type="text" id="name" placeholder="이름">
        <input type="text" id="job" placeholder="직업">
        <input type="number" id="hp" placeholder="HP">
        <button onclick="createSheet()">생성하기</button>
    </div>

    <div id="result" class="sheet">
        <h2 id="out-name">캐릭터 이름</h2>
        <p>직업: <span id="out-job"></span></p>
        <p>체력(HP): <span id="out-hp"></span></p>
    </div>

    <script>
        function createSheet() {
            // 입력값 가져오기
            const name = document.getElementById('name').value;
            const job = document.getElementById('job').value;
            const hp = document.getElementById('hp').value;

            // 결과창에 넣기
            document.getElementById('out-name').innerText = name || "이름 없음";
            document.getElementById('out-job').innerText = job || "무직";
            document.getElementById('out-hp').innerText = hp || "0";

            // 결과창 보이기
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
