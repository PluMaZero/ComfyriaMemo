<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>캐릭터 시트 작성기 - 업로드 포함</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; gap: 20px; max-width: 900px; width: 100%; }
        .box { background: white; padding: 20px; border-radius: 10px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        #preview { width: 100%; max-height: 300px; object-fit: contain; margin-top: 10px; border: 1px solid #ddd; }
        textarea { width: 100%; height: 80px; margin-top: 10px; }
        input { width: 90%; margin-bottom: 10px; padding: 5px; }
    </style>
</head>
<body>

    <h1>캐릭터 시트 & 프롬프트 생성기</h1>

    <div class="container">
        <!-- 왼쪽: 업로드 및 입력 -->
        <div class="box">
            <h3>이미지 업로드</h3>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
            <img id="preview" src="#" alt="미리보기" style="display:none;">
            
            <hr>
            <input type="text" id="charName" placeholder="캐릭터 특징 (예: 갈색머리 모험가)">
            <input type="text" id="outfit" placeholder="의상 컨셉 (예: 오렌지 셔츠와 베이지 바지)">
            <button onclick="generatePrompts()">프롬프트 생성</button>
        </div>

        <!-- 오른쪽: 결과 출력 -->
        <div class="box">
            <h3>프롬프트 결과</h3>
            <p>3면도 프롬프트:</p>
            <textarea id="refSheet"></textarea>
            <p>아이템 시트 프롬프트:</p>
            <textarea id="itemSheet"></textarea>
        </div>
    </div>

    <script>
        // 1. 이미지 미리보기 기능
        function previewImage(event) {
            const preview = document.getElementById('preview');
            const file = event.target.files[0];
            const reader = new FileReader();

            reader.onload = function() {
                preview.src = reader.result;
                preview.style.display = 'block';
            }
            if (file) reader.readAsDataURL(file);
        }

        // 2. 프롬프트 생성 기능
        function generatePrompts() {
            const name = document.getElementById('charName').value;
            const outfit = document.getElementById('outfit').value;

            document.getElementById('refSheet').value = 
                `Character sheet of ${name}, wearing ${outfit}, front view, side view, back view, standing on white background, high quality, anime style, flat color.`;
            
            document.getElementById('itemSheet').value = 
                `Design sheet of items for ${name}, including ${outfit}, detailed accessories, detached objects, white background, high resolution.`;
        }
    </script>
</body>
</html>
