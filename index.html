<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfyria_Memo - 3D Character Preview</title>
    <!-- 1. model-viewer 라이브러리 로드 -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #1e1e1e; padding: 20px; display: flex; flex-direction: column; align-items: center; color: #333; margin: 0; }
        h1 { color: #ffffff; }
        .container { display: flex; gap: 20px; max-width: 1400px; width: 100%; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
        .box { background-color: #ffffff; padding: 25px; border-radius: 15px; flex: 1; min-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); box-sizing: border-box; }
        
        /* 3D 뷰어 및 사이드 패널 스타일 */
        #viewer-container { 
            width: 100%; height: 500px; background: #282828; border-radius: 10px; 
            overflow: hidden; position: relative; 
        }
        model-viewer { width: 100%; height: 100%; }

        .side-panel {
            position: absolute; top: 10px; left: 10px; display: flex;
            flex-direction: column; gap: 6px; z-index: 100;
        }
        .control-btn {
            background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px; backdrop-filter: blur(4px); cursor: pointer;
            padding: 4px 8px; font-size: 11px; font-weight: bold; text-align: left;
        }
        .control-btn.active { color: #4ade80; }
        
        .slider-box {
            background: rgba(0,0,0,0.6); padding: 6px 8px; border-radius: 4px;
            color: white; font-size: 10px; display: flex; flex-direction: column; gap: 4px;
        }
        .stats-box {
            background: rgba(0,0,0,0.6); padding: 6px 8px; border-radius: 4px;
            color: #aaa; font-size: 10px; font-family: monospace;
        }

        /* 기존 UI 유지 */
        input, textarea { width: 100%; margin-bottom: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button.main-btn { padding: 12px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

    <h1>캐릭터 시트 & 3D 프리뷰</h1>

    <div class="container">
        <!-- 입력 및 결과 UI는 이전과 동일하므로 생략 가능 (구조 유지를 위해 간단히 배치) -->
        <div class="box">
            <h3>정보 입력</h3>
            <input type="text" id="charName" placeholder="캐릭터 특징">
            <textarea id="outfit" placeholder="의상 정보"></textarea>
            <button class="main-btn" onclick="alert('프롬프트 생성 기능은 그대로 유지하세요!')">프롬프트 생성</button>
        </div>

        <!-- 3D 뷰어부 (전달받으신 코드의 핵심 기능 이식) -->
        <div class="box" style="flex: 1.5;">
            <h3>3D Preview Control</h3>
            <div id="viewer-container">
                <!-- 사이드 컨트롤 패널 -->
                <div class="side-panel">
                    <button id="wireframeBtn" class="control-btn">Wireframe: OFF</button>
                    <button id="rotateBtn" class="control-btn">Auto Rotate: OFF</button>
                    <button id="gridBtn" class="control-btn">Grid: OFF</button>
                    <div class="slider-box">
                        <label id="exposureLabel">Brightness: 1.0</label>
                        <input type="range" id="exposureSlider" min="0" max="3" step="0.1" value="1.0">
                    </div>
                    <div id="statsDiv" class="stats-box">Vertices: -<br>Faces: -</div>
                </div>

                <!-- model-viewer 본체 -->
                <!-- Wizard.glb 파일 이름을 본인의 파일명으로 바꾸세요 -->
                <model-viewer id="charViewer" src="Wizard.glb" camera-controls shadow-intensity="1" environment-image="neutral">
                </model-viewer>
            </div>
        </div>
    </div>

    <script type="module">
        const viewer = document.querySelector('#charViewer');
        const wireframeBtn = document.querySelector('#wireframeBtn');
        const rotateBtn = document.querySelector('#rotateBtn');
        const gridBtn = document.querySelector('#gridBtn');
        const exposureSlider = document.querySelector('#exposureSlider');
        const exposureLabel = document.querySelector('#exposureLabel');
        const statsDiv = document.querySelector('#statsDiv');

        let wireframeState = false;
        let gridHelper = null;

        // --- 1. 와이어프레임 토글 ---
        wireframeBtn.onclick = () => {
            wireframeState = !wireframeState;
            const sceneSymbol = Object.getOwnPropertySymbols(viewer).find(s => s.description === 'scene');
            const scene = viewer[sceneSymbol];
            if (scene) {
                scene.traverse((obj) => {
                    if (obj.isMesh && obj.material) {
                        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                        mats.forEach(m => { m.wireframe = wireframeState; });
                    }
                });
            }
            wireframeBtn.innerText = `Wireframe: ${wireframeState ? 'ON' : 'OFF'}`;
            wireframeBtn.classList.toggle('active', wireframeState);
        };

        // --- 2. 자동 회전 토글 ---
        rotateBtn.onclick = () => {
            const isRotating = viewer.hasAttribute('auto-rotate');
            if (isRotating) viewer.removeAttribute('auto-rotate');
            else viewer.setAttribute('auto-rotate', '');
            rotateBtn.innerText = `Auto Rotate: ${!isRotating ? 'ON' : 'OFF'}`;
            rotateBtn.classList.toggle('active', !isRotating);
        };

        // --- 3. 밝기(Exposure) 조절 ---
        exposureSlider.oninput = (e) => {
            const val = e.target.value;
            viewer.setAttribute('exposure', val);
            exposureLabel.innerText = `Brightness: ${val}`;
        };

        // --- 4. 그리드 표시 ---
        gridBtn.onclick = () => {
            const sceneSymbol = Object.getOwnPropertySymbols(viewer).find(s => s.description === 'scene');
            const scene = viewer[sceneSymbol];
            // model-viewer 내부에서 사용하는 Three.js 라이브러리 접근을 위해 꼼수 사용
            const THREE = window.THREE || viewer[Object.getOwnPropertySymbols(viewer).find(s => s.description === 'three')]; 
            
            if (!gridHelper && scene) {
                // 직접 Three.js의 GridHelper 생성 (기본 라이브러리가 로드되어 있어야 함)
                // 여기서는 간단하게 표시 유무만 처리
            }
            gridBtn.classList.toggle('active');
            alert("그리드 기능은 별도의 Three.js 라이브러리 설정이 필요합니다.");
        };

        // --- 5. 모델 정보(Stats) 표시 ---
        viewer.addEventListener('load', () => {
            let vCount = 0, fCount = 0;
            const sceneSymbol = Object.getOwnPropertySymbols(viewer).find(s => s.description === 'scene');
            const scene = viewer[sceneSymbol];
            
            if (scene) {
                scene.traverse((obj) => {
                    if (obj.isMesh && obj.geometry) {
                        vCount += obj.geometry.attributes.position.count;
                        fCount += obj.geometry.index ? obj.geometry.index.count / 3 : obj.geometry.attributes.position.count / 3;
                    }
                });
                statsDiv.innerHTML = `Vertices: ${new Intl.NumberFormat().format(vCount)}<br>Faces: ${new Intl.NumberFormat().format(Math.floor(fCount))}`;
            }
        });
    </script>
</body>
</html>
