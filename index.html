<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfyria_Memo - 캐릭터 시트 & 3D 공유 아카이브</title>
    
    <!-- 1. 라이브러리 로드 -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
      }
    }
    </script>

    <style>
        /* 기본 배경 및 폰트 설정 */
        body { font-family: 'Pretendard', sans-serif; background-color: #1e1e1e; padding: 20px; display: flex; flex-direction: column; align-items: center; color: #333; margin: 0; }
        h1 { color: #ffffff; margin-bottom: 30px; }

        /* 상단 3개 박스 레이아웃 */
        .container { display: flex; gap: 20px; max-width: 1500px; width: 100%; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
        
        /* 공통 박스 스타일 */
        .box { background-color: #ffffff; padding: 25px; border-radius: 15px; flex: 1; min-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); box-sizing: border-box; }
        h3 { color: #333; margin-top: 0; }
        
        input, textarea { width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background-color: #f9f9f9; color: #333; font-family: inherit; }
        #preview { width: 100%; max-height: 200px; object-fit: contain; margin-bottom: 15px; border: 1px solid #ddd; display: none; }
        
        button { padding: 12px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        button:hover { background-color: #6366f1; }
        .copy-btn { background-color: #10b981; }
        .copy-btn:hover { background-color: #059669; }
        textarea { height: 100px; resize: vertical; }

        /* 3D 뷰어 스타일 */
        .viewer-box { position: relative; width: 100%; height: 450px; background-color: #282828; border-radius: 10px; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; }

        /* 3D 컨트롤러 패널 */
        .side-panel { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 100; pointer-events: none; }
        .ctrl-btn { pointer-events: auto; background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; backdrop-filter: blur(4px); cursor: pointer; padding: 4px 8px; font-size: 10px; font-weight: bold; width: fit-content; text-align: left; }
        .ctrl-btn.active { color: #4ade80; }
        .ctrl-slider { pointer-events: auto; background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 6px 8px; font-size: 9px; display: flex; flex-direction: column; gap: 4px; width: 100px; }
        .ctrl-stats { pointer-events: none; background: rgba(0,0,0,0.6); color: #aaa; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 6px 8px; font-size: 9px; font-family: monospace; line-height: 1.4; }

        /* 게시판 구역 스타일 */
        .archive-section { width: 100%; max-width: 1460px; margin-top: 40px; }
        .post-form { display: flex; gap: 20px; background: #fff; padding: 25px; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; width: 100%; }
        .post-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; display: flex; flex-direction: column; }
        .post-card img { width: 100%; height: 200px; object-fit: cover; }
        .post-card-body { padding: 15px; flex: 1; }
        .post-card h4 { margin: 0 0 10px 0; font-size: 18px; color: #333; }
        .post-card p { margin: 0; font-size: 14px; color: #666; line-height: 1.5; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>캐릭터 시트 & 3D 공유 아카이브</h1>

    <div class="container">
        <!-- 1. 입력부 (기존 유지) -->
        <div class="box">
            <h3>이미지 업로드 및 정보 입력</h3>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
            <img id="preview" src="#" alt="미리보기">
            <input type="text" id="charName" placeholder="캐릭터 특징 (예: 갈색머리 모험가)">
            <textarea id="outfit" placeholder="주요 의상 (예: 오렌지 셔츠, 베이지 바지)"></textarea>
            <textarea id="items" placeholder="아이템 상세 (예: 가죽 배낭, 나침반, 목걸이, 등산화)"></textarea>
            <button onclick="generatePrompts()">프롬프트 생성하기</button>
        </div>

        <!-- 2. 결과부 (기존 유지) -->
        <div class="box">
            <h3>프롬프트 결과</h3>
            <p style="font-size: 13px; font-weight: bold; margin-bottom: 5px;">3면도 프롬프트:</p>
            <textarea id="refSheet"></textarea>
            <button class="copy-btn" onclick="copyText('refSheet')">복사하기</button>

            <p style="font-size: 13px; font-weight: bold; margin-bottom: 5px; margin-top: 10px;">아이템 디자인 시트 프롬프트:</p>
            <textarea id="itemSheet"></textarea>
            <button class="copy-btn" onclick="copyText('itemSheet')">복사하기</button>
        </div>

        <!-- 3. 3D 뷰어부 (새로 추가) -->
        <div class="box">
            <h3>Character 3D Preview</h3>
            <div class="viewer-box">
                <div class="side-panel">
                    <button id="wireframeBtn" class="ctrl-btn">Wireframe: OFF</button>
                    <button id="rotateBtn" class="ctrl-btn">Auto Rotate: OFF</button>
                    <div class="ctrl-slider">
                        <span id="expLabel">Brightness: 1.0</span>
                        <input type="range" id="expSlider" min="0" max="3" step="0.1" value="1.0" style="width: 100%; cursor: pointer;">
                    </div>
                    <div id="statsBox" class="ctrl-stats">Vertices: -<br>Faces: -</div>
                </div>
                <model-viewer id="mainViewer" src="Wizard.glb" camera-controls shadow-intensity="1" environment-image="neutral"></model-viewer>
            </div>
            <p style="font-size: 11px; color: #888; margin-top: 10px; text-align: center;">마우스 드래그로 회전 / 휠로 확대</p>
        </div>
    </div>

    <!-- 4. 실시간 공유 게시판 (추가) -->
    <div class="archive-section">
        <h2 style="color: white; text-align: center; margin-bottom: 25px;">Public Character Archive (Firebase)</h2>
        <div class="post-form">
            <div style="flex: 0 0 200px;">
                <p style="font-size: 11px; margin-bottom: 5px; color: #666;">대표 이미지 (자동 압축됨)</p>
                <input type="file" id="archiveImage" accept="image/*">
            </div>
            <div style="flex: 1;">
                <input type="text" id="archiveTitle" placeholder="캐릭터 이름 또는 제목">
                <textarea id="archiveContent" placeholder="캐릭터의 특징을 기록하고 다른 사람과 공유하세요." style="height: 80px; margin-bottom: 0;"></textarea>
            </div>
            <div style="flex: 0 0 150px; display: flex; align-items: flex-end;">
                <button id="uploadBtn" style="height: 80px; background-color: #10b981; margin-bottom: 0;">공유 등록</button>
            </div>
        </div>
        <div id="postGrid" class="post-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "firebase/firestore";

        // Firebase 설정 (사용자님 스크린샷 정보 반영)
        const firebaseConfig = {
            apiKey: "AIzaSyBWnQDkl2piNG5U4ryHnO5_jtsByHt5nsI",
            authDomain: "comfyriadatabase.firebaseapp.com",
            projectId: "comfyriadatabase",
            storageBucket: "comfyriadatabase.firebasestorage.app",
            messagingSenderId: "865184071401",
            appId: "1:865184071401:web:096466cabb3adb489efa78",
            measurementId: "G-GNQ7S5DBEG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- 이미지 압축 및 Base64 변환 함수 ---
        const compressAndToBase64 = (file) => new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_WIDTH = 1000;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7)); // 70% 압축
                };
            };
        });

        // --- Firebase 업로드 로직 ---
        const uploadBtn = document.getElementById('uploadBtn');
        uploadBtn.onclick = async () => {
            const title = document.getElementById('archiveTitle').value;
            const content = document.getElementById('archiveContent').value;
            const file = document.getElementById('archiveImage').files[0];

            if (!title || !file) { alert("이미지와 이름을 넣어주세요!"); return; }
            uploadBtn.innerText = "압축 및 공유 중...";
            uploadBtn.disabled = true;

            try {
                const compressedImg = await compressAndToBase64(file);
                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    image: compressedImg,
                    createdAt: new Date()
                });
                alert("성공적으로 공유되었습니다!");
                document.getElementById('archiveTitle').value = '';
                document.getElementById('archiveContent').value = '';
                document.getElementById('archiveImage').value = '';
            } catch (e) {
                console.error(e);
                alert("업로드 실패! Firestore 권한 설정을 확인하세요.");
            } finally {
                uploadBtn.innerText = "공유 등록";
                uploadBtn.disabled = false;
            }
        };

        // --- 실시간 게시물 리스트 업데이트 ---
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const grid = document.getElementById('postGrid');
            grid.innerHTML = '';
            snapshot.forEach((doc) => {
                const post = doc.data();
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <img src="${post.image}">
                    <div class="post-card-body">
                        <h4>${post.title}</h4>
                        <p>${post.content}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        });

        // --- 기존 프롬프트 생성 함수 등록 (글로벌 윈도우용) ---
        window.previewImage = function(event) {
            const preview = document.getElementById('preview');
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = () => { preview.src = reader.result; preview.style.display = 'block'; }
            if (file) reader.readAsDataURL(file);
        };

        window.generatePrompts = function() {
            const name = document.getElementById('charName').value;
            const outfit = document.getElementById('outfit').value;
            const items = document.getElementById('items').value;
            // 사용자님의 기존 문구 규칙 그대로 적용
            document.getElementById('refSheet').value = `Character sheet of ${name}, wearing ${outfit}, front view, side view, back view, standing on white background, high quality, anime style, flat color, masterpiece.`;
            document.getElementById('itemSheet').value = `Design sheet of isolated items and accessories for ${name}, including ${outfit} and ${items}. Items arranged neatly on a plain white background, professional reference sheet style, high resolution, detailed texture, no character, no human, flat 2D layout, clear edges, product photography.`;
        };

        window.copyText = function(id) {
            const textarea = document.getElementById(id);
            textarea.select();
            document.execCommand('copy');
            alert('프롬프트가 복사되었습니다!');
        };

        // --- 3D 뷰어 컨트롤 로직 ---
        const mv = document.querySelector('#mainViewer');
        const wireframeBtn = document.querySelector('#wireframeBtn');
        const rotateBtn = document.querySelector('#rotateBtn');
        const expSlider = document.querySelector('#expSlider');
        const expLabel = document.querySelector('#expLabel');
        const statsBox = document.querySelector('#statsBox');
        let wireframeActive = false;

        wireframeBtn.onclick = () => {
            wireframeActive = !wireframeActive;
            const sceneSymbol = Object.getOwnPropertySymbols(mv).find(s => s.description === 'scene');
            const scene = mv[sceneSymbol];
            if (scene) {
                scene.traverse((obj) => {
                    if (obj.isMesh && obj.material) {
                        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                        mats.forEach(m => { m.wireframe = wireframeActive; });
                    }
                });
            }
            wireframeBtn.innerText = `Wireframe: ${wireframeActive ? 'ON' : 'OFF'}`;
            wireframeBtn.classList.toggle('active', wireframeActive);
        };

        rotateBtn.onclick = () => {
            const active = mv.hasAttribute('auto-rotate');
            if (active) mv.removeAttribute('auto-rotate');
            else mv.setAttribute('auto-rotate', '');
            rotateBtn.innerText = `Auto Rotate: ${!active ? 'ON' : 'OFF'}`;
            rotateBtn.classList.toggle('active', !active);
        };

        expSlider.oninput = (e) => {
            mv.setAttribute('exposure', e.target.value);
            expLabel.innerText = `Brightness: ${Number(e.target.value).toFixed(1)}`;
        };

        mv.addEventListener('load', () => {
            let v = 0, f = 0;
            const sceneSymbol = Object.getOwnPropertySymbols(mv).find(s => s.description === 'scene');
            const scene = mv[sceneSymbol];
            if (scene) {
                scene.traverse((obj) => {
                    if (obj.isMesh && obj.geometry) {
                        v += obj.geometry.attributes.position.count;
                        f += obj.geometry.index ? obj.geometry.index.count / 3 : obj.geometry.attributes.position.count / 3;
                    }
                });
                statsBox.innerHTML = `Vertices: ${new Intl.NumberFormat().format(v)}<br>Faces: ${new Intl.NumberFormat().format(Math.floor(f))}`;
            }
        });
    </script>
</body>
</html>
